name: Bug 报告
description: 属性没写对、伪装被识破、界面异常、构建失败
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先跑一遍机型库校验，能挡掉一半「其实是数据不对」的问题：

        ```bash
        python3 app/tools-src/check-fingerprints.py
        ```
        贴日志时**不要**贴签名密钥、口令、序列号或任何 account token。

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型 / Android 版本 / ROM（例如 Pixel 7 · Android 15 · 官方）
      placeholder: 小米 14 · Android 14 · HyperOS 1.0
    validations:
      required: true

  - type: dropdown
    id: root
    attributes:
      label: root 方案
      options:
        - Magisk
        - KernelSU
        - KernelSU Next
        - APatch
        - 其他（在「补充说明」里写）
    validations:
      required: true

  - type: dropdown
    id: zygisk
    attributes:
      label: Zygisk 实现
      description: 只影响「App 级伪装」这一类问题
      options:
        - 不涉及 App 级伪装
        - Zygisk Next
        - KernelSU 自带
        - Magisk 内置
        - 其他（在「补充说明」里写）

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页或关于里显示的版本，或 APK 文件名
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始，一步一步写，越具体越快
      placeholder: |
        1. 机型库选「三星 Galaxy S24 Ultra」
        2. 点应用，确认写入 41 条
        3. 打开目标 App
        4. 目标 App 仍显示原机型
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        `adb logcat -s DeviceToolbox:*` 或应用内的导出；界面问题直接拖截图。
        请删掉里面的设备序列号。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我确认机型库里确实有这个目标机型（没有的话请改用「功能请求」补数据）
          required: true
        - label: 我试过「快照回滚」，问题仍能复现
        - label: 我读过 README 的「安全护栏」和「使用须知」
          required: true
